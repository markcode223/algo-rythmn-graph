<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Algo-Rythmn Contact Graph</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f6;
      display: flex; flex-direction: column;
      height: 100vh; overflow: hidden;
    }

    /* Toolbar */
    #toolbar {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 10px 16px; flex-shrink: 0;
    }
    #company-title { font-size: 17px; font-weight: 700; color: #1a1a1a; margin-bottom: 5px; }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge { font-size: 11px; padding: 3px 10px; border-radius: 12px; font-weight: 600; }
    .badge-sector   { background: #ede9ff; color: #4c3fb5; }
    .badge-priority { background: #fdecea; color: #a33222; }
    .badge-type     { background: #fff4d6; color: #7a5a00; }
    .badge-since    { background: #e8f4fd; color: #1a6a9a; }

    /* Legend */
    #legend {
      background: #fff; border-bottom: 1px solid #eee;
      padding: 6px 16px; display: flex; flex-wrap: wrap;
      gap: 12px; font-size: 11px; color: #555; flex-shrink: 0;
      align-items: center;
    }
    .leg { display: flex; align-items: center; gap: 5px; }
    .leg-dot  { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .leg-rect { width: 12px; height: 8px; border-radius: 2px; flex-shrink: 0; }
    .leg-hint { margin-left: auto; font-size: 10px; color: #aaa; font-style: italic; }

    /* Main area */
    #main { flex: 1; display: flex; min-height: 0; }
    #cy   { flex: 1; background: #fafafa; position: relative; }

    /* Info panel */
    #info-panel {
      width: 310px; background: #fff;
      border-left: 1px solid #e0e0e0;
      display: flex; flex-direction: column; flex-shrink: 0;
    }
    #info-header {
      padding: 12px 14px 8px; border-bottom: 1px solid #eee;
      font-size: 12px; font-weight: 600; color: #888;
      text-transform: uppercase; letter-spacing: 0.5px; flex-shrink: 0;
    }
    #info-content {
      padding: 12px 14px; font-size: 13px; color: #3d3d3a;
      overflow-y: auto; flex: 1; line-height: 1.6;
    }
    .hint { color: #ccc; font-size: 12px; }
    .info-row { margin-bottom: 12px; }
    .info-label {
      font-size: 10px; color: #aaa;
      text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px;
    }
    .info-value { color: #1a1a1a; word-break: break-word; white-space: pre-wrap; }
    .info-value a { color: #185FA5; text-decoration: none; }
    .info-value a:hover { text-decoration: underline; }
    .open-btn {
      display: inline-block; margin-top: 10px;
      padding: 7px 16px; background: #534AB7; color: #fff;
      border-radius: 6px; font-size: 12px; font-weight: 600;
      text-decoration: none; cursor: pointer;
    }
    .open-btn:hover { background: #4239a0; }
    .dbl-hint {
      display: inline-block; margin-top: 8px;
      font-size: 11px; color: #aaa;
      background: #f5f5f5; padding: 3px 8px; border-radius: 6px;
    }

    /* Loading */
    #loading {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center; color: #999; font-size: 14px;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid #eee; border-top-color: #534AB7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="toolbar">
  <div id="company-title">Loading…</div>
  <div class="badges" id="badges"></div>
</div>

<div id="legend">
  <div class="leg"><div class="leg-dot" style="background:#534AB7"></div> Company</div>
  <div class="leg"><div class="leg-dot" style="background:#1D9E75"></div> Contact</div>
  <div class="leg"><div class="leg-rect" style="background:#3a8fb7"></div> Role / Attr</div>
  <div class="leg"><div class="leg-rect" style="background:#5a6f80"></div> Notes</div>
  <div class="leg"><div class="leg-rect" style="background:#D85A30"></div> Meeting</div>
  <div class="leg"><div class="leg-rect" style="background:#BA7517"></div> Resource</div>
  <div class="leg"><div class="leg-dot" style="background:#8B74D8;opacity:0.8"></div> Introduced by</div>
  <div class="leg-hint">🔗 = link · double-click to open</div>
</div>

<div id="main">
  <div id="cy"><div id="loading"><div class="spinner"></div>Loading graph…</div></div>
  <div id="info-panel">
    <div id="info-header">Details</div>
    <div id="info-content">
      <p class="hint">Click any node to see details.<br>Double-click a 🔗 node to open its link.</p>
    </div>
  </div>
</div>

<script>
  // ── CONFIG ───────────────────────────────────────────────────
 var SUPABASE_URL      = "https://enfyxksujosbwgguicwy.supabase.co";
 var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVuZnl4a3N1am9zYndnZ3VpY3d5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxMzk1MTIsImV4cCI6MjA5NTcxNTUxMn0.WQCPYrDMxmYQkJjM1rGJ5VNSescAv2zB8KYaLNYpY4M";

  // ────────────────────────────────────────────────────────────

  var H = {
    "apikey":        SUPABASE_ANON_KEY,
    "Authorization": "Bearer " + SUPABASE_ANON_KEY,
    "Content-Type":  "application/json"
  };

  // ── URL classification ───────────────────────────────────────
  // Returns { type, icon, label } based on the URL pattern
  function classifyUrl(url) {
    if (!url) return null;
    var u = url.toLowerCase().trim();
    if (!u.startsWith("http")) return null;

    // Your own decks
    if (u.includes("deck.algo-rythmn.ai"))
      return { type: "deck",    icon: "📊", label: "Deck" };

    // Your own web apps / projects
    if (u.includes("algo-rythmn.ai"))
      return { type: "webapp",  icon: "🌐", label: "Web App" };

    // Google Docs
    if (u.includes("docs.google.com/document"))
      return { type: "gdoc",    icon: "📄", label: "Google Doc" };

    // Google Sheets
    if (u.includes("docs.google.com/spreadsheet") || u.includes("sheets.google.com"))
      return { type: "gsheet",  icon: "📊", label: "Google Sheet" };

    // Google Slides
    if (u.includes("docs.google.com/presentation") || u.includes("slides.google.com"))
      return { type: "gslide",  icon: "📊", label: "Google Slides" };

    // Google Drive file
    if (u.includes("drive.google.com"))
      return { type: "gdrive",  icon: "📁", label: "Drive File" };

    // Gmail
    if (u.includes("mail.google.com"))
      return { type: "gmail",   icon: "✉️",  label: "Email Thread" };

    // Google Meet / Gemini notes
    if (u.includes("meet.google.com") || u.includes("gemini.google"))
      return { type: "meeting", icon: "🎥", label: "Meeting Notes" };

    // External website
    return { type: "web", icon: "🔗", label: "Link" };
  }

  function isUrl(s) {
    if (!s) return false;
    return /^https?:\/\//i.test(s.toString().trim());
  }

  function extractFirstUrl(text) {
    if (!text) return "";
    var m = text.match(/(https?:\/\/[^\s\)\"\']+)/);
    return m ? m[1] : "";
  }

  // Extract ALL urls from a text block
  function extractAllUrls(text) {
    if (!text) return [];
    return text.match(/(https?:\/\/[^\s\)\"\']+)/g) || [];
  }

  function trunc(s, n) {
    if (!s) return "";
    s = s.toString().trim();
    return s.length > n ? s.substring(0, n) + "…" : s;
  }

  // Make a short human-readable label for a URL
  function urlNodeLabel(url) {
    var classified = classifyUrl(url);
    if (!classified) return trunc(url, 28);
    try {
      var domain = new URL(url).hostname.replace("www.", "");
      return classified.icon + " " + trunc(domain, 24);
    } catch(e) {
      return classified.icon + " " + trunc(url, 24);
    }
  }

  // Replace all URLs in text with clickable <a> tags for the info panel
  function linkifyText(text) {
    if (!text) return "";
    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/(https?:\/\/[^\s\)\"\']+)/g, function(url) {
        var c = classifyUrl(url);
        var label = c ? c.icon + " " + url : url;
        return "<a href='" + url + "' target='_blank' rel='noopener noreferrer'>" + label + "</a>";
      })
      .replace(/\n/g, "<br>");
  }

  function openLink(url) {
    if (!url) return;
    window.open(url, "_blank", "noopener,noreferrer");
  }

  // ── API ───────────────────────────────────────────────────────
  async function api(path) {
    var res = await fetch(SUPABASE_URL + "/rest/v1/" + path, { headers: H });
    if (!res.ok) throw new Error("API error " + res.status);
    return res.json();
  }

  // ── Boot ──────────────────────────────────────────────────────
  var companyName = new URLSearchParams(window.location.search).get("company") || "";
  if (!companyName) {
    document.getElementById("loading").innerHTML =
      "<p style='color:#c00'>No company specified.<br>Add ?company=Name to URL.</p>";
  } else {
    loadGraph(companyName);
  }

  async function loadGraph(name) {
    try {
      var companies = await api(
        "companies?name=ilike." + encodeURIComponent(name) +
        "&limit=1&select=id,name,sector,status,priority,contact_type,notes,since,from_product_team"
      );
      if (!companies.length) {
        document.getElementById("loading").innerHTML =
          "<p style='color:#c00'>No company found: <b>" + name + "</b></p>";
        return;
      }
      var co  = companies[0];
      var cid = co.id;

      var [contacts, meetings, resources, relationships] = await Promise.all([
        api("contacts?company_id=eq."      + cid + "&select=id,full_name,role,email,notes,status"),
        api("meetings?company_id=eq."      + cid + "&select=id,title,summary_url,notes"),
        api("resources?company_id=eq."     + cid + "&select=id,label,resource_type,url"),
        api("relationships?to_company_id=eq." + cid + "&select=id,from_contact_id,note")
      ]);

      document.getElementById("loading").style.display = "none";
      buildToolbar(co);
      buildGraph(co, contacts, meetings, resources, relationships);
    } catch(err) {
      document.getElementById("loading").innerHTML =
        "<p style='color:#c00'>Error: " + err.message + "</p>";
    }
  }

  // ── Toolbar ───────────────────────────────────────────────────
  function buildToolbar(co) {
    document.getElementById("company-title").textContent = co.name;
    var bc = document.getElementById("badges");

    // Only show sector, priority, type, since as badges
    // Do NOT show status enum — we show full original text in info panel instead
    [
      { v: co.sector,       c: "badge-sector"   },
      { v: co.priority,     c: "badge-priority" },
      { v: co.contact_type, c: "badge-type"     },
      { v: co.since ? "Since " + co.since.substring(0,7) : null, c: "badge-since" },
    ].forEach(function(b) {
      if (!b.v || b.v === "null") return;
      var s = document.createElement("span");
      s.className = "badge " + b.c;
      s.textContent = b.v;
      bc.appendChild(s);
    });
  }

  // ── Graph builder ─────────────────────────────────────────────
  function buildGraph(co, contacts, meetings, resources, relationships) {
    var nodes = [], edges = [];

    // ── Company node ──────────────────────────────────────────
    nodes.push({ data: {
      id: "company", label: co.name,
      type: "company", detail: co, url: ""
    }});

    // Company notes node — shows FULL original text from STATUS + NOTES + DEMOS
    // This is the verbatim content, never paraphrased
    if (co.notes && co.notes.trim().length > 2) {
      var notesUrl = extractFirstUrl(co.notes);
      nodes.push({ data: {
        id: "co_notes",
        label: "📝 Notes & Status",
        type: "co_notes",
        attrLabel: "Notes / Status (original)",
        attrValue: co.notes,  // ← full verbatim original text
        url: notesUrl
      }});
      edges.push({ data: { source: "company", target: "co_notes", etype: "co_attr" }});
    }

    // Company from_product_team — may contain multiple URLs
    if (co.from_product_team && co.from_product_team.trim()) {
      var ptUrl = extractFirstUrl(co.from_product_team);
      nodes.push({ data: {
        id: "co_pt",
        label: ptUrl ? urlNodeLabel(ptUrl) : "📋 Product Team",
        type: "co_pt",
        attrLabel: "From Product Team",
        attrValue: co.from_product_team,
        url: ptUrl
      }});
      edges.push({ data: { source: "company", target: "co_pt", etype: "co_attr" }});
    }

    // Priority node
    if (co.priority) {
      nodes.push({ data: {
        id: "co_priority", label: "↑ " + co.priority,
        type: "co_attr", attrLabel: "Priority", attrValue: co.priority, url: ""
      }});
      edges.push({ data: { source: "company", target: "co_priority", etype: "co_attr" }});
    }

    // Type node
    if (co.contact_type) {
      nodes.push({ data: {
        id: "co_type", label: co.contact_type,
        type: "co_attr", attrLabel: "Type", attrValue: co.contact_type, url: ""
      }});
      edges.push({ data: { source: "company", target: "co_type", etype: "co_attr" }});
    }

    // ── Meeting nodes ─────────────────────────────────────────
    meetings.forEach(function(m) {
      var id  = "m_" + m.id;
      var url = m.summary_url || extractFirstUrl(m.notes) || "";
      var classified = classifyUrl(url);
      var icon  = classified ? classified.icon : "🎥";
      var label = icon + " " + trunc(m.title || "Meeting", 28);
      nodes.push({ data: { id: id, label: label, type: "meeting", detail: m, url: url }});
      edges.push({ data: { source: "company", target: id, etype: "meeting" }});
    });

    // ── Resource nodes ────────────────────────────────────────
    resources.forEach(function(r) {
      var id  = "r_" + r.id;
      var url = r.url || "";
      var classified = classifyUrl(url);
      var icon  = classified ? classified.icon  : "🔗";
      var label = icon + " " + trunc(r.label || r.resource_type || "Resource", 26);
      nodes.push({ data: { id: id, label: label, type: "resource", detail: r, url: url }});
      edges.push({ data: { source: "company", target: id, etype: "resource" }});
    });

    // ── Referral map ──────────────────────────────────────────
    var refMap = {};
    relationships.forEach(function(rel) {
      var raw = (rel.note || "");
      var introducer = raw
        .replace(/^Introduced .+ via:\s*/i, "")
        .replace(/^Source:\s*/i, "")
        .trim();
      if (!introducer) return;
      var key = rel.from_contact_id || "__company";
      if (!refMap[key]) refMap[key] = [];
      refMap[key].push({ introducer: introducer, note: raw });
    });

    // ── Contact nodes + their attributes ─────────────────────
    contacts.forEach(function(p) {
      var cid = "c_" + p.id;
      nodes.push({ data: { id: cid, label: p.full_name, type: "contact", detail: p, url: "" }});
      edges.push({ data: { source: "company", target: cid, etype: "contact" }});

      // Role
      if (p.role) {
        var rid = cid + "_role";
        var roleUrl = extractFirstUrl(p.role);
        var roleClassified = classifyUrl(roleUrl);
        var roleIcon = roleClassified ? roleClassified.icon + " " : "";
        nodes.push({ data: {
          id: rid,
          label: roleIcon + trunc(p.role, 32),
          type: "attr_role",
          attrLabel: "Role", attrValue: p.role,
          parentName: p.full_name, url: roleUrl
        }});
        edges.push({ data: { source: cid, target: rid, etype: "attr" }});
      }

      // Email — mailto link
      if (p.email) {
        var eid = cid + "_email";
        nodes.push({ data: {
          id: eid,
          label: "✉ " + trunc(p.email, 26),
          type: "attr_email",
          attrLabel: "Email", attrValue: p.email,
          parentName: p.full_name,
          url: "mailto:" + p.email
        }});
        edges.push({ data: { source: cid, target: eid, etype: "attr" }});
      }

      // Notes — full verbatim original, never paraphrased
      if (p.notes && p.notes.trim().length > 8) {
        var nid = cid + "_notes";
        var noteUrl = extractFirstUrl(p.notes);
        nodes.push({ data: {
          id: nid,
          label: noteUrl ? "🔗 Notes" : "📝 Notes",
          type: "attr_notes",
          attrLabel: "Notes (original)",
          attrValue: p.notes,    // ← full verbatim
          parentName: p.full_name,
          url: noteUrl
        }});
        edges.push({ data: { source: cid, target: nid, etype: "attr" }});
      }

      // Per-contact referrals
      var refs = refMap[p.id] || [];
      refs.forEach(function(ref, i) {
        var refId = cid + "_ref_" + i;
        nodes.push({ data: {
          id: refId, label: ref.introducer,
          type: "referral",
          attrLabel: "Introduced by", attrValue: ref.introducer,
          parentName: p.full_name, url: ""
        }});
        edges.push({ data: { source: refId, target: cid, etype: "referral" }});
      });
    });

    // Unattached referrals → company
    (refMap["__company"] || []).forEach(function(ref, i) {
      var refId = "co_ref_" + i;
      nodes.push({ data: {
        id: refId, label: ref.introducer,
        type: "referral",
        attrLabel: "Introduced by", attrValue: ref.introducer,
        parentName: "", url: ""
      }});
      edges.push({ data: { source: refId, target: "company", etype: "referral" }});
    });

    // ── Cytoscape ─────────────────────────────────────────────
    var cy = cytoscape({
      container: document.getElementById("cy"),
      elements: { nodes: nodes, edges: edges },
      style: [
        // Company
        { selector: '[type="company"]', style: {
          "background-color": "#534AB7", "color": "#fff",
          "label": "data(label)", "font-size": 14, "font-weight": "bold",
          "text-valign": "center", "text-halign": "center",
          "shape": "round-rectangle", "width": 180, "height": 56,
          "text-wrap": "wrap", "text-max-width": 165
        }},
        // Contact
        { selector: '[type="contact"]', style: {
          "background-color": "#1D9E75", "color": "#fff",
          "label": "data(label)", "font-size": 12, "font-weight": "bold",
          "text-valign": "center", "shape": "ellipse",
          "width": 130, "height": 48,
          "text-wrap": "wrap", "text-max-width": 120
        }},
        // Company-level notes (original text)
        { selector: '[type="co_notes"]', style: {
          "background-color": "#5a6f80", "color": "#fff",
          "label": "data(label)", "font-size": 10,
          "text-valign": "center", "shape": "round-rectangle",
          "width": 120, "height": 30
        }},
        // Company from product team
        { selector: '[type="co_pt"]', style: {
          "background-color": "#3a8fb7", "color": "#fff",
          "label": "data(label)", "font-size": 10,
          "text-valign": "center", "shape": "round-rectangle",
          "width": 130, "height": 30,
          "text-wrap": "ellipsis", "text-max-width": 120
        }},
        // Generic company attribute
        { selector: '[type="co_attr"]', style: {
          "background-color": "#6c5fc7", "background-opacity": 0.7, "color": "#fff",
          "label": "data(label)", "font-size": 10,
          "text-valign": "center", "shape": "round-rectangle",
          "width": 110, "height": 28,
          "text-wrap": "ellipsis", "text-max-width": 100
        }},
        // Role
        { selector: '[type="attr_role"]', style: {
          "background-color": "#3a8fb7", "color": "#fff",
          "label": "data(label)", "font-size": 10,
          "text-valign": "center", "shape": "round-rectangle",
          "width": 125, "height": 28,
          "text-wrap": "ellipsis", "text-max-width": 115
        }},
        // Email
        { selector: '[type="attr_email"]', style: {
          "background-color": "#1a7a9e", "color": "#fff",
          "label": "data(label)", "font-size": 10,
          "text-valign": "center", "shape": "round-rectangle",
          "width": 135, "height": 28,
          "text-wrap": "ellipsis", "text-max-width": 125
        }},
        // Notes (contact-level)
        { selector: '[type="attr_notes"]', style: {
          "background-color": "#5a6f80", "color": "#fff",
          "label": "data(label)", "font-size": 10,
          "text-valign": "center", "shape": "round-rectangle",
          "width": 95, "height": 28
        }},
        // Meeting
        { selector: '[type="meeting"]', style: {
          "background-color": "#D85A30", "color": "#fff",
          "label": "data(label)", "font-size": 10,
          "text-valign": "center", "shape": "round-rectangle",
          "width": 145, "height": 34,
          "text-wrap": "ellipsis", "text-max-width": 135
        }},
        // Resource
        { selector: '[type="resource"]', style: {
          "background-color": "#BA7517", "color": "#fff",
          "label": "data(label)", "font-size": 10,
          "text-valign": "center", "shape": "round-diamond",
          "width": 135, "height": 54,
          "text-wrap": "ellipsis", "text-max-width": 122
        }},
        // Referral
        { selector: '[type="referral"]', style: {
          "background-color": "#8B74D8", "background-opacity": 0.8, "color": "#fff",
          "label": "data(label)", "font-size": 11,
          "text-valign": "center", "shape": "ellipse",
          "width": 115, "height": 40,
          "border-width": 2, "border-color": "#534AB7",
          "text-wrap": "wrap", "text-max-width": 105
        }},
        // Nodes with links get a blue border
        { selector: '[url != ""]', style: {
          "border-width": 2.5, "border-color": "#185FA5", "border-opacity": 0.7
        }},
        // Edges
        { selector: "edge", style: {
          "width": 1.5, "line-color": "#d0d0d0",
          "curve-style": "bezier",
          "target-arrow-shape": "triangle", "target-arrow-color": "#d0d0d0",
          "arrow-scale": 0.8
        }},
        { selector: '[etype="co_attr"]', style: {
          "line-color": "#b8b0e8", "target-arrow-color": "#b8b0e8",
          "width": 1, "target-arrow-shape": "none", "line-style": "dotted"
        }},
        { selector: '[etype="attr"]', style: {
          "line-color": "#c0d8e4", "target-arrow-color": "#c0d8e4",
          "width": 1, "target-arrow-shape": "none"
        }},
        { selector: '[etype="referral"]', style: {
          "line-style": "dashed",
          "line-color": "#b0a8e8", "target-arrow-color": "#b0a8e8",
          "target-arrow-shape": "triangle"
        }},
        { selector: '[etype="meeting"]',  style: { "line-color": "#e8a090", "target-arrow-color": "#e8a090", "width": 1.2 }},
        { selector: '[etype="resource"]', style: { "line-color": "#d4a060", "target-arrow-color": "#d4a060", "width": 1.2 }},
        { selector: "node:active", style: { "overlay-opacity": 0.1 }},
        { selector: ":selected",   style: { "border-width": 3, "border-color": "#1a1a1a" }}
      ],
      layout: {
        name: "cose", padding: 60, animate: true,
        animationDuration: 600, randomize: false,
        nodeRepulsion: 8000, idealEdgeLength: 130,
        gravity: 0.25, numIter: 1000
      }
    });

    // ── Single tap → info panel ───────────────────────────────
    cy.on("tap", "node", function(evt) {
      var d  = evt.target.data();
      var ic = document.getElementById("info-content");
      var html = "";

      function row(label, value) {
        if (!value || value === "null") return "";
        return "<div class='info-row'>" +
          "<div class='info-label'>" + label + "</div>" +
          "<div class='info-value'>" + linkifyText(value) + "</div></div>";
      }

      function btnLink(url, label) {
        if (!url) return "";
        var c = classifyUrl(url);
        var icon = c ? c.icon + " " : "🔗 ";
        return "<a class='open-btn' href='" + url +
          "' target='_blank' rel='noopener noreferrer'>" + icon + (label || "Open link") + "</a>";
      }

      if (d.type === "company") {
        var co = d.detail;
        html += row("Company",  co.name);
        html += row("Sector",   co.sector);
        // Show original full text — NOT the enum
        html += row("Priority", co.priority);
        html += row("Type",     co.contact_type);
        html += row("Since",    co.since);
        if (co.notes)
          // Full verbatim original text
          html += row("Notes / Status (original)", co.notes);
        if (co.from_product_team)
          html += row("From Product Team", co.from_product_team);

      } else if (d.type === "co_notes" || d.type === "co_pt") {
        // Full verbatim original text — linkified but not paraphrased
        html += "<div class='info-row'><div class='info-label'>" + d.attrLabel + "</div>" +
          "<div class='info-value'>" + linkifyText(d.attrValue) + "</div></div>";
        if (d.url) html += btnLink(d.url, "Open link");

      } else if (d.type === "co_attr") {
        html += row(d.attrLabel, d.attrValue);

      } else if (d.type === "contact") {
        var p = d.detail;
        html += row("Contact", p.full_name);
        html += row("Role",    p.role);
        if (p.email)
          html += "<div class='info-row'><div class='info-label'>Email</div>" +
            "<div class='info-value'><a href='mailto:" + p.email + "'>" + p.email + "</a></div></div>";
        // Full verbatim notes
        if (p.notes) html += row("Notes (original)", p.notes);

      } else if (d.type === "attr_role") {
        if (d.parentName) html += row("Contact", d.parentName);
        html += row("Role", d.attrValue);   // full original role text
        if (d.url) html += btnLink(d.url);

      } else if (d.type === "attr_email") {
        if (d.parentName) html += row("Contact", d.parentName);
        html += "<div class='info-row'><div class='info-label'>Email</div>" +
          "<div class='info-value'><a href='mailto:" + d.attrValue + "'>" + d.attrValue + "</a></div></div>";

      } else if (d.type === "attr_notes") {
        if (d.parentName) html += row("Contact", d.parentName);
        // Full verbatim notes — linkified, never paraphrased
        html += "<div class='info-row'><div class='info-label'>Notes (original)</div>" +
          "<div class='info-value'>" + linkifyText(d.attrValue) + "</div></div>";
        if (d.url) html += btnLink(d.url);

      } else if (d.type === "meeting") {
        var m = d.detail;
        html += row("Meeting", m.title);
        if (m.summary_url) html += btnLink(m.summary_url, "Open meeting notes");
        if (m.notes) html += row("Notes (original)", m.notes);

      } else if (d.type === "resource") {
        var r = d.detail;
        var c = classifyUrl(r.url);
        html += row("Type",  c ? c.label : r.resource_type);
        html += row("Label", r.label);
        if (r.url) html += btnLink(r.url, "Open " + (c ? c.label : "link"));

      } else if (d.type === "referral") {
        html += row("Introduced by", d.attrValue);
        if (d.parentName) html += row("Introduced contact", d.parentName);
      }

      // Double-click hint for nodes with links
      if (d.url && d.url !== "") {
        html += "<span class='dbl-hint'>Double-click to open link</span>";
      }

      ic.innerHTML = html || "<p class='hint'>No details available.</p>";
    });

    // ── Double-click → open link ──────────────────────────────
    cy.on("dblclick", "node", function(evt) {
      var url = evt.target.data().url;
      if (url) openLink(url);
    });

    // ── Background tap → reset panel ─────────────────────────
    cy.on("tap", function(evt) {
      if (evt.target === cy) {
        document.getElementById("info-content").innerHTML =
          "<p class='hint'>Click any node to see details.<br>Double-click a 🔗 node to open its link.</p>";
      }
    });
  }
</script>
</body>
</html>
