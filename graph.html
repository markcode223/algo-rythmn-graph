<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Algo-Rythmn Contact Graph</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f6;
      display: flex; flex-direction: column;
      height: 100vh; overflow: hidden;
    }

    /* ── Toolbar ─────────────────────────────────────────────── */
    #toolbar {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 10px 16px; flex-shrink: 0;
    }
    #company-title {
      font-size: 17px; font-weight: 700; color: #1a1a1a; margin-bottom: 5px;
    }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge {
      font-size: 11px; padding: 3px 10px;
      border-radius: 12px; font-weight: 600;
    }
    .badge-sector   { background: #ede9ff; color: #4c3fb5; }
    .badge-priority { background: #fdecea; color: #a33222; }
    .badge-type     { background: #fff4d6; color: #7a5a00; }
    .badge-since    { background: #e8f4fd; color: #1a6a9a; }

    /* ── Legend ──────────────────────────────────────────────── */
    #legend {
      background: #fff; border-bottom: 1px solid #eee;
      padding: 6px 16px;
      display: flex; flex-wrap: wrap; gap: 12px;
      font-size: 11px; color: #555; flex-shrink: 0;
      align-items: center;
    }
    .leg { display: flex; align-items: center; gap: 5px; }
    .leg-dot  { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .leg-rect { width: 12px; height: 8px; border-radius: 2px; flex-shrink: 0; }
    .leg-hint { margin-left: auto; font-size: 10px; color: #aaa; font-style: italic; }

    /* ── Main ────────────────────────────────────────────────── */
    #main { flex: 1; display: flex; min-height: 0; }
    #cy   { flex: 1; background: #fafafa; position: relative; }

    /* ── Info panel ──────────────────────────────────────────── */
    #info-panel {
      width: 310px; background: #fff;
      border-left: 1px solid #e0e0e0;
      display: flex; flex-direction: column; flex-shrink: 0;
    }
    #info-header {
      padding: 12px 14px 8px; border-bottom: 1px solid #eee;
      font-size: 12px; font-weight: 600; color: #888;
      text-transform: uppercase; letter-spacing: 0.5px; flex-shrink: 0;
    }
    #info-content {
      padding: 12px 14px; font-size: 13px; color: #3d3d3a;
      overflow-y: auto; flex: 1; line-height: 1.6;
    }
    .hint { color: #ccc; font-size: 12px; }
    .info-row { margin-bottom: 12px; }
    .info-label {
      font-size: 10px; color: #aaa;
      text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px;
    }
    .info-value {
      color: #1a1a1a; word-break: break-word; white-space: pre-wrap;
    }
    .info-value a { color: #185FA5; text-decoration: none; }
    .info-value a:hover { text-decoration: underline; }
    .open-btn {
      display: inline-block; margin-top: 10px;
      padding: 7px 16px; background: #534AB7; color: #fff;
      border-radius: 6px; font-size: 12px; font-weight: 600;
      text-decoration: none;
    }
    .open-btn:hover { background: #4239a0; }
    .dbl-hint {
      display: inline-block; margin-top: 8px;
      font-size: 11px; color: #aaa;
      background: #f5f5f5; padding: 3px 8px; border-radius: 6px;
    }

    /* ── Loading ─────────────────────────────────────────────── */
    #loading {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center; color: #999; font-size: 14px;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid #eee; border-top-color: #534AB7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="toolbar">
  <div id="company-title">Loading…</div>
  <div class="badges" id="badges"></div>
</div>

<div id="legend">
  <div class="leg"><div class="leg-dot" style="background:#534AB7"></div> Company</div>
  <div class="leg"><div class="leg-dot" style="background:#1D9E75"></div> Contact</div>
  <div class="leg"><div class="leg-rect" style="background:#3a8fb7"></div> Role / Attr</div>
  <div class="leg"><div class="leg-rect" style="background:#5a6f80"></div> Notes / Status</div>
  <div class="leg"><div class="leg-rect" style="background:#D85A30"></div> Meeting</div>
  <div class="leg"><div class="leg-rect" style="background:#BA7517"></div> Resource</div>
  <div class="leg"><div class="leg-dot" style="background:#8B74D8;opacity:0.8"></div> Introduced by</div>
  <div class="leg-hint">Blue border = has link · double-click to open</div>
</div>

<div id="main">
  <div id="cy">
    <div id="loading"><div class="spinner"></div>Building graph…</div>
  </div>
  <div id="info-panel">
    <div id="info-header">Details</div>
    <div id="info-content">
      <p class="hint">Click any node to see details.<br>Double-click a node with a blue border to open its link.</p>
    </div>
  </div>
</div>

<script>
  // ── URL classifier ────────────────────────────────────────────
  function classifyUrl(url) {
    if (!url) return null;
    var u = url.toLowerCase().trim();
    if (!u.startsWith("http") && !u.startsWith("mailto")) return null;
    if (u.startsWith("mailto"))                    return { icon: "✉️",  label: "Email",          type: "email"   };
    if (u.includes("deck.algo-rythmn.ai"))         return { icon: "📊", label: "Deck",            type: "deck"    };
    if (u.includes("algo-rythmn.ai"))              return { icon: "🌐", label: "Web App",          type: "webapp"  };
    if (u.includes("docs.google.com/document"))    return { icon: "📄", label: "Google Doc",       type: "gdoc"    };
    if (u.includes("docs.google.com/spreadsheet")) return { icon: "📊", label: "Google Sheet",     type: "gsheet"  };
    if (u.includes("docs.google.com/presentation"))return { icon: "📊", label: "Google Slides",    type: "gslide"  };
    if (u.includes("drive.google.com"))            return { icon: "📁", label: "Drive File",        type: "gdrive"  };
    if (u.includes("mail.google.com"))             return { icon: "✉️",  label: "Email Thread",     type: "gmail"   };
    if (u.includes("meet.google.com"))             return { icon: "🎥", label: "Meeting",           type: "meeting" };
    if (u.includes("gemini.google"))               return { icon: "🎥", label: "Meeting Notes",     type: "meeting" };
    if (u.includes("calendar.google"))             return { icon: "📅", label: "Calendar",          type: "calendar"};
    return                                                { icon: "🔗", label: "Link",              type: "web"     };
  }

  function isUrl(s) {
    return /^https?:\/\//i.test((s || "").toString().trim());
  }

  function extractFirstUrl(text) {
    if (!text) return "";
    var m = text.match(/(https?:\/\/[^\s\)\"\']+)/);
    return m ? m[1] : "";
  }

  function trunc(s, n) {
    if (!s) return "";
    s = s.toString().trim();
    return s.length > n ? s.substring(0, n) + "…" : s;
  }

  // Build a short label for a URL node using its classification
  function urlNodeLabel(url, fallbackText) {
    var c = classifyUrl(url);
    var icon = c ? c.icon + " " : "🔗 ";
    if (fallbackText && !isUrl(fallbackText)) {
      return icon + trunc(fallbackText, 26);
    }
    try {
      var domain = new URL(url).hostname.replace("www.", "");
      return icon + trunc(domain, 26);
    } catch(e) {
      return icon + trunc(url, 26);
    }
  }

  // Turn all URLs in text into clickable links for the info panel
  function linkifyText(text) {
    if (!text) return "";
    return text
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/(https?:\/\/[^\s\)\"\']+)/g, function(url) {
        var c = classifyUrl(url);
        return "<a href='" + url + "' target='_blank' rel='noopener noreferrer'>" +
          (c ? c.icon + " " : "") + url + "</a>";
      })
      .replace(/\n/g, "<br>");
  }

  function openLink(url) {
    if (url) window.open(url, "_blank", "noopener,noreferrer");
  }

  // ── Boot: read data from URL param ───────────────────────────
  var rawParam = new URLSearchParams(window.location.search).get("data");
  if (!rawParam) {
    document.getElementById("loading").innerHTML =
      "<p style='color:#c00'>No data received.<br>Open this from Google Sheets.</p>";
  } else {
    try {
      var data = JSON.parse(decodeURIComponent(rawParam));
      document.getElementById("loading").style.display = "none";
      buildToolbar(data.company);
      buildGraph(data);
    } catch(e) {
      document.getElementById("loading").innerHTML =
        "<p style='color:#c00'>Error parsing data: " + e.message + "</p>";
    }
  }

  // ── Toolbar ───────────────────────────────────────────────────
  function buildToolbar(co) {
    document.getElementById("company-title").textContent = co.name;
    var bc = document.getElementById("badges");
    [
      { v: co.sector,       c: "badge-sector"   },
      { v: co.priority,     c: "badge-priority" },
      { v: co.contact_type, c: "badge-type"     },
      { v: co.since ? "Since " + co.since : null, c: "badge-since" }
    ].forEach(function(b) {
      if (!b.v || b.v === "null" || b.v.trim() === "") return;
      var s = document.createElement("span");
      s.className = "badge " + b.c;
      s.textContent = b.v;
      bc.appendChild(s);
    });
  }

  // ── Graph builder ─────────────────────────────────────────────
  function buildGraph(data) {
    var nodes = [], edges = [];
    var co = data.company;

    // ── Company node ──────────────────────────────────────────
    nodes.push({ data: {
      id: "company", label: co.name,
      type: "company", detail: co, url: ""
    }});

    // Company: Status / Notes node
    // Shows FULL verbatim original text — never paraphrased
    var statusAndNotes = [co.status, co.notes, co.demos]
      .filter(function(s){ return s && s.trim(); })
      .join("\n\n");
    if (statusAndNotes) {
      var snUrl = extractFirstUrl(statusAndNotes);
      nodes.push({ data: {
        id: "co_status", label: "📝 Notes & Status",
        type: "co_notes",
        attrLabel: "Notes / Status (original)",
        attrValue: statusAndNotes,  // verbatim — no summarization
        url: snUrl
      }});
      edges.push({ data: { source: "company", target: "co_status", etype: "co_attr" }});
    }

    // Company: Priority
    if (co.priority) {
      nodes.push({ data: {
        id: "co_priority", label: "↑ " + co.priority,
        type: "co_attr", attrLabel: "Priority", attrValue: co.priority, url: ""
      }});
      edges.push({ data: { source: "company", target: "co_priority", etype: "co_attr" }});
    }

    // Company: Type
    if (co.contact_type) {
      nodes.push({ data: {
        id: "co_type", label: co.contact_type,
        type: "co_attr", attrLabel: "Type", attrValue: co.contact_type, url: ""
      }});
      edges.push({ data: { source: "company", target: "co_type", etype: "co_attr" }});
    }

    // Company: Product Team resources
    // Each URL becomes its own node
    var ptUrls = extractAllUrls(co.product_team);
    if (co.product_team_url && ptUrls.indexOf(co.product_team_url) === -1) {
      ptUrls.unshift(co.product_team_url);
    }
    ptUrls.forEach(function(url, i) {
      var id = "co_pt_" + i;
      nodes.push({ data: {
        id: id, label: urlNodeLabel(url, ""),
        type: "resource", url: url,
        detail: { label: labelFromContext(url, co.product_team), resource_type: "product_team", url: url }
      }});
      edges.push({ data: { source: "company", target: id, etype: "resource" }});
    });

    // Meetings
    data.meetings.forEach(function(m, i) {
      var id  = "meeting_" + i;
      var url = m.url || extractFirstUrl(m.title) || "";
      var c   = classifyUrl(url);
      var icon = c ? c.icon + " " : "🎥 ";
      nodes.push({ data: {
        id: id,
        label: icon + trunc(m.title || "Meeting notes", 28),
        type: "meeting", detail: m, url: url
      }});
      edges.push({ data: { source: "company", target: id, etype: "meeting" }});
    });

    // Resources (from product team already handled above)
    data.resources.forEach(function(r, i) {
      if (!r.url) return;
      // Avoid duplicating product team URLs
      var alreadyAdded = ptUrls.indexOf(r.url) !== -1;
      if (alreadyAdded) return;
      var id = "res_" + i;
      nodes.push({ data: {
        id: id, label: urlNodeLabel(r.url, r.label),
        type: "resource", detail: r, url: r.url
      }});
      edges.push({ data: { source: "company", target: id, etype: "resource" }});
    });

    // ── Contacts ──────────────────────────────────────────────
    data.contacts.forEach(function(p, ci) {
      var cid = "c_" + ci;
      nodes.push({ data: {
        id: cid, label: p.name,
        type: "contact", detail: p, url: ""
      }});
      edges.push({ data: { source: "company", target: cid, etype: "contact" }});

      // Role
      if (p.role) {
        var rid  = cid + "_role";
        var rUrl = extractFirstUrl(p.role);
        nodes.push({ data: {
          id: rid, label: trunc(p.role, 34),
          type: "attr_role",
          attrLabel: "Role", attrValue: p.role,
          parentName: p.name, url: rUrl
        }});
        edges.push({ data: { source: cid, target: rid, etype: "attr" }});
      }

      // Email address
      if (p.email) {
        var eid = cid + "_email";
        nodes.push({ data: {
          id: eid, label: "✉ " + trunc(p.email, 26),
          type: "attr_email",
          attrLabel: "Email", attrValue: p.email,
          parentName: p.name,
          url: "mailto:" + p.email   // mailto always works
        }});
        edges.push({ data: { source: cid, target: eid, etype: "attr" }});
      }

      // Info (non-email content from INFO column e.g. "Chief of Staff to...")
      if (p.info) {
        var iid  = cid + "_info";
        var iUrl = extractFirstUrl(p.info);
        nodes.push({ data: {
          id: iid, label: trunc(p.info, 30),
          type: "attr_role",   // same style as role
          attrLabel: "Info", attrValue: p.info,
          parentName: p.name, url: iUrl
        }});
        edges.push({ data: { source: cid, target: iid, etype: "attr" }});
      }

      // Email chain link — this is the hyperlink from col G
      // Show even if display text is just "email"
      if (p.email_chain_url) {
        var ecid = cid + "_emailchain";
        nodes.push({ data: {
          id: ecid,
          label: urlNodeLabel(p.email_chain_url, p.email_chain_text || "Email chain"),
          type: "attr_link",
          attrLabel: "Email Chain",
          attrValue: p.email_chain_text || p.email_chain_url,
          parentName: p.name,
          url: p.email_chain_url   // ← the real URL from the hyperlink
        }});
        edges.push({ data: { source: cid, target: ecid, etype: "attr" }});
      }

      // Notes link — hyperlink from col I
      // Show even if display text is just "Alberta Gov meeting notes"
      if (p.notes_url) {
        var nid2 = cid + "_noteslink";
        nodes.push({ data: {
          id: nid2,
          label: urlNodeLabel(p.notes_url, p.notes_text || "Notes"),
          type: "attr_link",
          attrLabel: "Notes",
          attrValue: p.notes_text || p.notes_url,
          parentName: p.name,
          url: p.notes_url   // ← the real URL from the hyperlink
        }});
        edges.push({ data: { source: cid, target: nid2, etype: "attr" }});
      }
      // If notes has plain text (no URL), show as text node
      else if (p.notes_text && p.notes_text.trim().length > 5) {
        var ntid = cid + "_notestext";
        nodes.push({ data: {
          id: ntid, label: "📝 Notes",
          type: "attr_notes",
          attrLabel: "Notes (original)", attrValue: p.notes_text,
          parentName: p.name, url: ""
        }});
        edges.push({ data: { source: cid, target: ntid, etype: "attr" }});
      }

      // Demos seen link
      if (p.demos_url) {
        var did2 = cid + "_demos";
        nodes.push({ data: {
          id: did2,
          label: urlNodeLabel(p.demos_url, p.demos_text || "Demos seen"),
          type: "attr_link",
          attrLabel: "Demos Seen",
          attrValue: p.demos_text || p.demos_url,
          parentName: p.name,
          url: p.demos_url
        }});
        edges.push({ data: { source: cid, target: did2, etype: "attr" }});
      }

      // Introduced by (SOURCE column)
      if (p.source) {
        var sfid = cid + "_source";
        nodes.push({ data: {
          id: sfid, label: p.source,
          type: "referral",
          attrLabel: "Introduced by", attrValue: p.source,
          parentName: p.name, url: ""
        }});
        edges.push({ data: { source: sfid, target: cid, etype: "referral" }});
      }
    });

    // ── Cytoscape init ────────────────────────────────────────
    var cy = cytoscape({
      container: document.getElementById("cy"),
      elements: { nodes: nodes, edges: edges },
      style: [
        // Company — large central purple
        { selector: '[type="company"]', style: {
          "background-color": "#534AB7", "color": "#fff",
          "label": "data(label)", "font-size": 14, "font-weight": "bold",
          "text-valign": "center", "text-halign": "center",
          "shape": "round-rectangle", "width": 185, "height": 58,
          "text-wrap": "wrap", "text-max-width": 172
        }},
        // Contact — green ellipse
        { selector: '[type="contact"]', style: {
          "background-color": "#1D9E75", "color": "#fff",
          "label": "data(label)", "font-size": 12, "font-weight": "bold",
          "text-valign": "center", "shape": "ellipse",
          "width": 132, "height": 50,
          "text-wrap": "wrap", "text-max-width": 122
        }},
        // Company notes / status node
        { selector: '[type="co_notes"]', style: {
          "background-color": "#5a6f80", "color": "#fff",
          "label": "data(label)", "font-size": 10,
          "text-valign": "center", "shape": "round-rectangle",
          "width": 125, "height": 30
        }},
        // Generic company attribute
        { selector: '[type="co_attr"]', style: {
          "background-color": "#6c5fc7", "background-opacity": 0.7, "color": "#fff",
          "label": "data(label)", "font-size": 10,
          "text-valign": "center", "shape": "round-rectangle",
          "width": 112, "height": 28,
          "text-wrap": "ellipsis", "text-max-width": 102
        }},
        // Role / info attribute
        { selector: '[type="attr_role"]', style: {
          "background-color": "#3a8fb7", "color": "#fff",
          "label": "data(label)", "font-size": 10,
          "text-valign": "center", "shape": "round-rectangle",
          "width": 128, "height": 28,
          "text-wrap": "ellipsis", "text-max-width": 118
        }},
        // Email address attribute
        { selector: '[type="attr_email"]', style: {
          "background-color": "#1a7a9e", "color": "#fff",
          "label": "data(label)", "font-size": 10,
          "text-valign": "center", "shape": "round-rectangle",
          "width": 138, "height": 28,
          "text-wrap": "ellipsis", "text-max-width": 128
        }},
        // Link attribute (email chain, notes link, demos link)
        { selector: '[type="attr_link"]', style: {
          "background-color": "#2471a3", "color": "#fff",
          "label": "data(label)", "font-size": 10,
          "text-valign": "center", "shape": "round-rectangle",
          "width": 128, "height": 28,
          "text-wrap": "ellipsis", "text-max-width": 118
        }},
        // Notes text (no URL)
        { selector: '[type="attr_notes"]', style: {
          "background-color": "#5a6f80", "color": "#fff",
          "label": "data(label)", "font-size": 10,
          "text-valign": "center", "shape": "round-rectangle",
          "width": 90, "height": 28
        }},
        // Meeting
        { selector: '[type="meeting"]', style: {
          "background-color": "#D85A30", "color": "#fff",
          "label": "data(label)", "font-size": 10,
          "text-valign": "center", "shape": "round-rectangle",
          "width": 148, "height": 36,
          "text-wrap": "ellipsis", "text-max-width": 138
        }},
        // Resource / deck / web app
        { selector: '[type="resource"]', style: {
          "background-color": "#BA7517", "color": "#fff",
          "label": "data(label)", "font-size": 10,
          "text-valign": "center", "shape": "round-diamond",
          "width": 138, "height": 56,
          "text-wrap": "ellipsis", "text-max-width": 124
        }},
        // Referral / introduced by
        { selector: '[type="referral"]', style: {
          "background-color": "#8B74D8", "background-opacity": 0.85, "color": "#fff",
          "label": "data(label)", "font-size": 11,
          "text-valign": "center", "shape": "ellipse",
          "width": 118, "height": 42,
          "border-width": 2, "border-color": "#534AB7",
          "text-wrap": "wrap", "text-max-width": 108
        }},

        // ── LINK INDICATOR — blue border on any node with a URL
        { selector: '[url != ""]', style: {
          "border-width": 2.5,
          "border-color": "#185FA5",
          "border-opacity": 0.85
        }},

        // ── Edges
        { selector: "edge", style: {
          "width": 1.5, "line-color": "#d0d0d0",
          "curve-style": "bezier",
          "target-arrow-shape": "triangle", "target-arrow-color": "#d0d0d0",
          "arrow-scale": 0.8
        }},
        { selector: '[etype="co_attr"]', style: {
          "line-color": "#b8b0e8", "target-arrow-color": "#b8b0e8",
          "width": 1, "target-arrow-shape": "none", "line-style": "dotted"
        }},
        { selector: '[etype="attr"]', style: {
          "line-color": "#c0d8e4", "target-arrow-color": "#c0d8e4",
          "width": 1, "target-arrow-shape": "none"
        }},
        { selector: '[etype="referral"]', style: {
          "line-style": "dashed",
          "line-color": "#b0a8e8", "target-arrow-color": "#b0a8e8",
          "target-arrow-shape": "triangle"
        }},
        { selector: '[etype="meeting"]',  style: { "line-color": "#e8a090", "target-arrow-color": "#e8a090", "width": 1.2 }},
        { selector: '[etype="resource"]', style: { "line-color": "#d4a060", "target-arrow-color": "#d4a060", "width": 1.2 }},
        { selector: "node:active", style: { "overlay-opacity": 0.1 }},
        { selector: ":selected",   style: { "border-width": 3, "border-color": "#1a1a1a" }}
      ],
      layout: {
        name: "cose", padding: 60, animate: true,
        animationDuration: 600, randomize: false,
        nodeRepulsion: 8500, idealEdgeLength: 130,
        gravity: 0.25, numIter: 1000
      }
    });

    // ── Single tap → info panel ───────────────────────────────
    cy.on("tap", "node", function(evt) {
      var d  = evt.target.data();
      var ic = document.getElementById("info-content");
      var html = "";

      function row(label, value) {
        if (!value || value.toString().trim() === "" || value === "null") return "";
        return "<div class='info-row'>" +
          "<div class='info-label'>" + label + "</div>" +
          "<div class='info-value'>" + linkifyText(value.toString()) + "</div></div>";
      }

      function btnLink(url, label) {
        if (!url) return "";
        var c = classifyUrl(url);
        return "<a class='open-btn' href='" + url +
          "' target='_blank' rel='noopener noreferrer'>" +
          (c ? c.icon + " " : "🔗 ") + (label || c && c.label || "Open link") + "</a>";
      }

      switch(d.type) {

        case "company":
          var co = d.detail;
          html += row("Company",  co.name);
          html += row("Sector",   co.sector);
          html += row("Priority", co.priority);
          html += row("Type",     co.contact_type);
          html += row("Since",    co.since);
          // Full verbatim original text — status, notes, demos
          var fullText = [co.status, co.notes, co.demos]
            .filter(function(s){ return s && s.trim(); }).join("\n\n");
          if (fullText) html += row("Notes / Status (original)", fullText);
          if (co.product_team) html += row("From Product Team", co.product_team);
          break;

        case "co_notes":
          // Full verbatim — never paraphrased
          html += "<div class='info-row'>" +
            "<div class='info-label'>" + d.attrLabel + "</div>" +
            "<div class='info-value'>" + linkifyText(d.attrValue) + "</div></div>";
          if (d.url) html += btnLink(d.url);
          break;

        case "co_attr":
          html += row(d.attrLabel, d.attrValue);
          break;

        case "contact":
          var p = d.detail;
          html += row("Contact", p.name);
          html += row("Role",    p.role);
          if (p.email)
            html += "<div class='info-row'><div class='info-label'>Email</div>" +
              "<div class='info-value'><a href='mailto:" + p.email + "'>" + p.email + "</a></div></div>";
          if (p.info)  html += row("Info", p.info);
          if (p.source) html += row("Introduced by", p.source);
          if (p.notes_text) html += row("Notes (original)", p.notes_text);
          if (p.email_chain_url)
            html += btnLink(p.email_chain_url, p.email_chain_text || "Email chain");
          if (p.notes_url)
            html += btnLink(p.notes_url, p.notes_text || "Notes");
          if (p.demos_url)
            html += btnLink(p.demos_url, p.demos_text || "Demos");
          break;

        case "attr_role":
          if (d.parentName) html += row("Contact", d.parentName);
          html += row(d.attrLabel, d.attrValue);
          if (d.url) html += btnLink(d.url);
          break;

        case "attr_email":
          if (d.parentName) html += row("Contact", d.parentName);
          html += "<div class='info-row'><div class='info-label'>Email</div>" +
            "<div class='info-value'><a href='mailto:" + d.attrValue + "'>" + d.attrValue + "</a></div></div>";
          break;

        case "attr_link":
          if (d.parentName) html += row("Contact", d.parentName);
          html += row(d.attrLabel, d.attrValue);
          if (d.url) html += btnLink(d.url);
          break;

        case "attr_notes":
          if (d.parentName) html += row("Contact", d.parentName);
          // Full verbatim original
          html += "<div class='info-row'>" +
            "<div class='info-label'>Notes (original)</div>" +
            "<div class='info-value'>" + linkifyText(d.attrValue) + "</div></div>";
          break;

        case "meeting":
          var m = d.detail;
          html += row("Meeting", m.title);
          if (m.url) html += btnLink(m.url, "Open meeting notes");
          if (m.notes) html += row("Notes (original)", m.notes);
          break;

        case "resource":
          var r = d.detail;
          var rc = classifyUrl(r.url || d.url);
          html += row("Type",  rc ? rc.label : (r.resource_type || "Link"));
          html += row("Label", r.label);
          if (r.url || d.url) html += btnLink(r.url || d.url, "Open " + (rc ? rc.label : "link"));
          break;

        case "referral":
          html += row("Introduced by", d.attrValue);
          if (d.parentName) html += row("Introduced contact", d.parentName);
          break;
      }

      // Double-click hint for link nodes
      if (d.url && d.url !== "") {
        html += "<span class='dbl-hint'>Double-click node to open link</span>";
      }

      ic.innerHTML = html || "<p class='hint'>No details available.</p>";
    });

    // ── Double-click → open link ──────────────────────────────
    cy.on("dblclick", "node", function(evt) {
      var url = evt.target.data().url;
      if (url) openLink(url);
    });

    // ── Background tap → reset ────────────────────────────────
    cy.on("tap", function(evt) {
      if (evt.target === cy) {
        document.getElementById("info-content").innerHTML =
          "<p class='hint'>Click any node to see details.<br>" +
          "Double-click a node with a blue border to open its link.</p>";
      }
    });
  }

  // ── Utility used by graph builder ────────────────────────────
  function extractAllUrls(text) {
    if (!text) return [];
    return text.match(/(https?:\/\/[^\s\)\"\']+)/g) || [];
  }

  function labelFromContext(url, context) {
    if (!context) return url;
    var idx = context.indexOf(url);
    if (idx < 0) return url;
    var before = context.substring(Math.max(0, idx - 60), idx).trim();
    var label  = before.split(/\n/).pop().trim();
    return label || url;
  }
</script>
</body>
</html>
